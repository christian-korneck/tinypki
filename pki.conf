# PKI Configuration
# Edit this file to customize your PKI settings

# PKI name (used for CA CN and Org)
PKI_NAME="contoso"

# PFX password (dummy password required for MS Windows)
PFX_PASSWORD="$PKI_NAME"

# CRL distribution URL (only required if USE_CRL_URL="true")
CRL_URL="http://crl.example.com/$PKI_NAME-intermediate.crl"

# Whether to embed CRL URL in certificates (true/false)
USE_CRL_URL="false"

# Certificate validity periods (in hours)
VALIDITY_ROOT_CA="876000h"           # 100 years
VALIDITY_INTERMEDIATE_CA="438000h"   # 50 years
VALIDITY_SERVER_CERTS="262800h"      # 30 years
VALIDITY_WILDCARD_CERTS="262800h"    # 30 years
